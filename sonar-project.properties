# SonarQube Cloud — ver https://sonarcloud.io
# Ajustar organization/projectKey depois de criar a organização no SonarQube Cloud
# (Sign up com a conta do GitHub silvars -> importar o repositório "refuge").
#
# ATENÇÃO: este arquivo só vale para análise via CI (.github/workflows/sonarqube.yml).
# A "Automatic Analysis" do SonarQube Cloud (ativada por padrão ao importar o repo)
# roda no lado deles e IGNORA este arquivo. Para excluir product/** também da
# Automatic Analysis, configurar manualmente em: Administration → General Settings
# → Analysis Scope → Files → Source File Exclusions → adicionar "product/**/*".
sonar.organization=silvars
sonar.projectKey=silvars_refuge
sonar.projectName=Refúgio Sensorial

# Código-fonte do app (existe a partir da Fase 1 do SDD; vazio antes disso não quebra a análise)
sonar.sources=app,src
sonar.tests=app,src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=**/node_modules/**,**/.expo/**,**/dist/**,**/coverage/**,**/ios/**,**/android/**,product/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/conteudo/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
