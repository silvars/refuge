name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: App ainda não existe (pré-Fase 1)
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "Sem package.json ainda — nada a validar até a Fase 1 do SDD (ver product/refugio-sensorial/02-sdd.md)."

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci --ignore-scripts

      - name: Lint
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint --if-present

      - name: Checar tipos
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run typecheck --if-present

      - name: Testes com cobertura
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run test --if-present -- --coverage

      - name: Guardar relatório de cobertura
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
