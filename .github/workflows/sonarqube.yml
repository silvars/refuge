name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: Análise de qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo: melhora a relevância da análise

      - name: App ainda não existe (pré-Fase 1)
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "Sem package.json ainda — nada a analisar até a Fase 1 do SDD (ver product/refugio-sensorial/02-sdd.md)."

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci --ignore-scripts

      - name: Testes com cobertura (lcov)
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run test --if-present -- --coverage --coverageReporters=lcov

      - name: SonarQube Scan
        if: ${{ hashFiles('package.json') != '' }}
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
